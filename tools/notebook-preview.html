<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../">
<title>노트북 미리보기</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link rel="stylesheet" href="css/styles.css">
<style>
  body{margin:0;padding:14px;background:var(--bg,#f6f7f9)}
  .pv-top{max-width:1200px;margin:0 auto 10px;display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}
  .pv-top button{padding:5px 11px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
  .pv-note{max-width:1200px;margin:0 auto 10px;font-size:12px;color:#777}
  #stage{max-width:1200px;margin:0 auto}
  #pv-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;display:none;z-index:99}
</style>
</head>
<body>
<div class="pv-top"><b>📓 노트북 미리보기</b>
  <button onclick="toggleTheme()">🌗 테마</button>
  <button onclick="localStorage.removeItem('nb-preview-progress');location.reload()">처음부터</button>
  <button onclick="location.search = location.search.includes('tc=1') ? '' : '?tc=1'"
    id="pv-who">학생/선생님 바꾸기</button>
</div>
<div class="pv-note">앱 로그인 없이 노트북 화면을 띄웁니다. 코드는 진짜로 실행되고, 저장만 이 브라우저(localStorage)에 흉내 냅니다.
  <b id="pv-mode"></b> — <code>?tc=1</code> 을 붙이면 <b>선생님 화면</b>(빈칸 토글 · 설명 고치기 · 그림 · 퀴즈),
  <code>?tc=1&amp;list=1</code> 이면 <b>노트북 목록</b>(여기서 「🧩 블록 고치기」로 들어갑니다)이 나옵니다.</div>
<div id="stage"></div>
<div id="modal-root"></div>
<div id="pv-toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="js/state.js"></script>
<script>
/* ── 앱에서 쓰는 것들 흉내 ── */
/* ?tc=1 이면 **선생님 화면**입니다 (2026-10-28) — 노트북을 짜는 손잡이가
   학생에게 새지 않는지, 선생님에게는 제대로 보이는지 여기서 봅니다. */
const PV_Q = new URLSearchParams(location.search);
const PV_TC = PV_Q.get('tc') === '1';
/* ?list=1 — 선생님 **노트북 목록** 화면. 거기서 「🧩 블록 고치기」 로 들어갑니다 */
const PV_LIST = PV_Q.get('list') === '1';
IS_TC = PV_TC;
// classId — nbInAssess() 가 이것으로 문이 달렸는지 봅니다
ST_USER = PV_TC ? null : { number: '20101', name: '미리보기', classId: 'ai-2B' };
SEL_CLS = { id: 'ai-2B', label: '인공지능 기초 2B', type: 'ai' };
TC_CLS = PV_TC ? SEL_CLS : null;
STUDENTS = [];
const CLASSES = [
  { id: 'ai-2B', label: '인공지능 기초 2B', short: '2B', type: 'ai' },
  { id: 'ai-2D', label: '인공지능 기초 2D', short: '2D', type: 'ai' },
];
const MAX_FILE_SIZE = 50 * 1024 * 1024;
/* 블록 설명 고치기 · 그림 · 다른 반 반영 — 저장은 흉내만 냅니다 */
async function loadNbBlockText(){ NB_BLK_TEXT = {}; return NB_BLK_TEXT; }
async function saveNbBlockText(){ }
async function uploadNbImage(){ return 'data:image/svg+xml;utf8,'
  + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="90">'
    + '<rect width="240" height="90" fill="#00703C"/><text x="12" y="52" fill="#fff"'
    + ' font-size="18">올린 그림 (흉내)</text></svg>'); }
async function loadAllNotebookProgress(){ return {}; }
async function copyNotebookToClasses(){ return ['ai-2D']; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDt(s){ return s ? new Date(s).toLocaleString('ko-KR') : ''; }
function genId(){ return Math.random().toString(36).slice(2, 10); }
function emptyBox(ic, msg){ return `<div style="padding:30px;text-align:center;color:#888">${ic} ${esc(msg)}</div>`; }
function toast(msg){ const t = document.getElementById('pv-toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2600); }
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }
function toggleTheme(){ const r = document.documentElement; r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }
function multiClassPicker(){ return ''; }
const db = { ref: () => ({ update: async () => {}, set: async () => {}, get: async () => ({ exists: () => false, val: () => null }) }) };
async function loadNotebookProgress(){ try { return JSON.parse(localStorage.getItem('nb-preview-progress') || 'null'); } catch(e){ return null; } }
async function saveNotebookProgress(cid, nbId, snum, cells){ localStorage.setItem('nb-preview-progress', JSON.stringify({ cells, updatedAt: new Date().toISOString() })); }
function render(){
  document.getElementById('stage').innerHTML =
    (PV_TC && PV_LIST) ? vTcNotebook()
    : SEL_NOTEBOOK ? vNotebookDetail(false) : emptyBox('📓', '노트북 없음');
  initNotebookCMs();
  const m = document.getElementById('pv-mode');
  if(m) m.textContent = PV_TC ? '지금 선생님 화면' : '지금 학생 화면';
}
const MD = s => s;
NOTEBOOKS = [{ id: 'demo', title: '데이터 분석 실습 — 산곡고 설문', createdAt: '2026-09-11', cells: [
  { id: 'c0', type: 'markdown', source: '# 데이터 분석 실습\n산곡고 1학년 설문 데이터로 **결측치·이상치**를 정리하고 **상관계수**를 구합니다.\n\n## step 1 데이터 불러오기' },
  { id: 'c1', type: 'code', source: '!git clone https://github.com/ryuk0305/sangokAI.git' },
  { id: 'c2', type: 'code', source: 'import pandas as pd\nimport matplotlib.pyplot as plt\ndf = pd.read_csv("/content/sangokAI/1grage_sangok.csv")\ndf.shape' },
  { id: 'c3', type: 'code', source: 'df.head()' },
  { id: 'c4', type: 'markdown', source: '## step 2 결측치와 이상치' },
  { id: 'c5', type: 'code', source: 'df = df.dropna()\nplt.boxplot(df["평균등급"])\nplt.title("평균등급 상자그림")\nplt.show()\nprint("남은 행 수:", len(df))' },
  { id: 'c6', type: 'markdown', source: '## step 3 상관계수' },
  { id: 'c7', type: 'code', source: 'import seaborn as sns\nsns.heatmap(df.corr(numeric_only=True), annot=True, fmt=".2f", cmap="coolwarm")\nplt.title("속성 사이의 상관계수")' },
  { id: 'c8', type: 'code', source: 'df.corr()' },
  { id: 'c9', type: 'code', source: 'for i in range(5):\n    print(i, "번째 줄")\nname = input("이름을 입력하세요: ")\nprint("반가워요,", name)' },
  /* 🧩 블록 셀 — 빈칸 토글을 볼 자리입니다 (2026-10-28).
     `load` 는 파일 칸이 빈칸, `score` 는 어느 데이터로 잴지가 빈칸입니다. */
  { id: 'c10', type: 'markdown', source: '## step 4 🧩 블록 셀' },
  { id: 'c11', type: 'code', blk: true, source: '',
    blocks: [{ k: 'load', a: { f: '' } }, { k: 'shape', a: { f: '' } }] },
  { id: 'c12', type: 'code', blk: true, source: '',
    blocks: [{ k: 'score', a: { m: 'dt', d: '' } }, { k: 'pred', a: { m: 'dt', v: '' } }] },
  /* 「모름」 단추를 볼 자리 (2026-10-29). 빈 블록 셀 + idk 입니다.
     이 노트북을 **문이 달린 것**으로 두어야 단추가 뜹니다 — 아래 NB_GATE 를 보세요. */
  { id: 'c13', type: 'markdown', source: '## step 5 「모름」 단추' },
  { id: 'c14', type: 'code', blk: true, source: '', blocks: [], noimp: true,
    idk: [{ k: 'dt', a: { d: 'None' } }, { k: 'fit', a: { m: 'dt' } },
          { k: 'score', a: { m: 'dt', d: 'test' } }] },
  /* 「모름」 이 안 달린 빈 블록 셀 — 단추가 **뜨면 안 됩니다** */
  { id: 'c15', type: 'code', blk: true, source: '', blocks: [] },
] }];
// 평가용(문이 달린) 노트북으로 둡니다 — nbInAssess() 가 참이 됩니다
// 평가용 · 보관을 같이 시험합니다 (2026-10-29)
NB_GATE_SEED = { 'ai-2B': { demo: 'closed', old1: 'archived' } };
NOTEBOOKS.push({ id: 'old1', title: '1. 파이썬 기초 (옛 코드판)',
  createdAt: '2026-09-23', cells: [{ id: 'o1', type: 'code', source: 'print(1)' }] });
NOTEBOOKS.push({ id: 'new1', title: '1. 파이썬 기초 · 데이터 불러오기',
  createdAt: '2026-10-29', cells: [{ id: 'n1', type: 'code', blk: true, blocks: [] }] });
</script>
<script src="js/nb-blocks.js"></script>
<script src="js/nb-open.js"></script>
<script src="js/nb-snippets.js"></script>
<script src="js/views/notebook.js"></script>
<script src="js/events/notebook.js"></script>
<script src="js/notebook-colab.js"></script>
<script>
// nb-open.js 가 NB_GATE 를 선언한 뒤에 심습니다
if(typeof NB_GATE_SEED !== 'undefined') NB_GATE = NB_GATE_SEED;
if(PV_TC && PV_LIST) render(); else openNotebook('demo');
</script>
</body>
</html>
